{% extends "base.html" %}

{% block title %}
MiniCTF
{% endblock %}

{% block content %}

<div class="hero">

    <h1>MiniCTF</h1>

    <p>
        A self-hosted CTF platform.
    </p>

    {% if current_user.is_authenticated %}

        <a class="button" href="{{ url_for('dashboard') }}">Dashboard</a>

    {% else %}

        <a class="button" href="{{ url_for('auth.register') }}">Register</a>
	<a class="button" href="{{ url_for('auth.login') }}">Login</a>

    {% endif %}

</div>

{% endblock %}
