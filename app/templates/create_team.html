{% extends "base.html" %}

{% block title %}
Create Team - MiniCTF
{% endblock %}

{% block content %}

<h1>Create Team</h1>

<div class="card">

    <form method="POST">

        <label>
            Team Name
        </label>

        <input
            type="text"
            name="name"
            minlength="3"
            maxlength="80"
            placeholder="13371337"
            required
        >

        <button type="submit">
            Create Team
        </button>

    </form>

</div>

{% endblock %}
