{% extends "base.html" %}

{% block title %}
Dashboard 
{% endblock %}

{% block content %}

<h1>Dashboard</h1>

<div class="card">

    <h2>
        Welcome, {{ current_user.username }}!
    </h2>

    <p>
        Your score
    </p>

    <div class="score">
        {{ current_user.score }}
    </div>

</div>


<div class="card">

    <h2>
        Progress
    </h2>

    <p>
        Challenges solved:
        {{ current_user.solves|length }}
    </p>

</div>


<a
    class="button"
    href="{{ url_for('challenges.list_challenges') }}"
>
    View Challenges
</a>

{% endblock %}
